[package]
name = "rankless-rally-server"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.8"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
